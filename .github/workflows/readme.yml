name: Update script list

on:
  push:
    branches: [main]
    paths: ["scripts.json", "tools/build_readme.py", "README.md"]
  schedule:
    - cron: "17 4 * * *"   # daily, so new versions pushed to the script repos show up here
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_readme.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update script list in README"
            git push
          fi
